[package]
name = "contaduria"
version = "0.1.0"
edition = "2024"

[dependencies]
askama = "0.16"
askama_web = { version = "0.16", features = ["axum-0.8"] }
axum = "0.8"
axum-extra = { version = "0.12", features = ["form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "time", "migrate", "macros", "json"] }
time = { version = "0.3.55", features = ["formatting", "macros", "parsing", "serde"] }
tokio = { version = "1", features = ["full"] }
tower-sessions = "0.14"
tower-sessions-sqlx-store = { version = "0.15", features = ["postgres"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
webauthn-rs = { version = "0.6", features = ["danger-allow-state-serialisation"] }
